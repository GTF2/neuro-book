<style>:root{color-scheme:light;--paper:#f1f4f5;--surface:#fff;--ink:#263236;--muted:#66777d;--border:#dbe2e5;--accent:#287b78;--accent-soft:#eaf4f2;--warning:#ae792a;--danger:#bd4e68}

<body>
<a class="skip" href="#node-list">跳到记忆列表</a>
<header class="topbar">
  <div><h1>小说记忆 <span>V7</span></h1></div>
  <p id="book-title" class="book-title"></p>
  <div class="file-actions"><button id="import-button" title="导入 JSON"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v12m5-7l-5-5l-5 5m14 7v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg> 导入 JSON</button><button id="export-button" title="导出 JSON"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10l5 5l5-5"/></g></svg> 导出 JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden></div>
</header>
<div id="message" role="status" class="message" hidden></div>
<section class="reading-bar" aria-label="阅读边界">
  <label>已读至 <select id="chapter" aria-label="阅读章节"></select></label>
  <label class="range-label"><input id="position" type="range" min="1" value="1" aria-label="阅读段落"><output id="position-label"></output></label>
  <button id="chapter-end">读至章末</button>
  <label>知情视角 <select id="perspective" aria-label="知情视角"><option value="reader">读者</option></select></label>
  <p id="snapshot-label" class="muted"></p>
</section>
<div id="coverage" class="coverage"></div>
<div id="overview" class="overview"></div>
<main class="workspace">
  <aside class="catalog" aria-label="记忆目录">
    <nav class="catalog-tabs" aria-label="知识类型"><button data-kind-tab="entity" aria-pressed="true">主体</button><button data-kind-tab="fact" aria-pressed="false">命题</button><button data-kind-tab="episode" aria-pressed="false">情节</button><button data-kind-tab="entitySummary" aria-pressed="false">摘要</button></nav>
    <div class="catalog-controls">
      <label for="search">主体与记忆</label><input id="search" type="search" placeholder="搜索主体 / 命题…" autocomplete="off">
      <details id="catalog-filters"><summary>筛选记录</summary><div class="filter-row"><select id="kind" aria-label="记忆类型"><option value="knowledge">知识入口</option><option value="all">全部类型</option></select><select id="status" aria-label="知识状态"><option value="all">全部状态</option><option value="accepted">已采纳</option><option value="tentative">待定</option><option value="disputed">有争议</option><option value="unsupported">无支撑</option><option value="stale">待重算</option><option value="pending">待处理</option></select></div>
      <select id="assertion" aria-label="命题类别"><option value="all">全部命题类别</option><option value="world">世界命题</option><option value="belief">角色信念</option><option value="speech">发言内容</option><option value="rule">规则</option><option value="hypothesis">假设</option><option value="paratext">书外说明</option><option value="fiction">嵌套虚构</option></select>
      </details><button id="selection-back" class="icon-button" disabled title="返回上一选择" aria-label="返回上一选择"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 19l-7-7l7-7m7 7H5"/></svg></button>
      <p id="list-count" class="muted" aria-live="polite"></p>
    </div>
    <div id="node-list" class="node-list" tabindex="-1"></div>
  </aside>
  <section class="canvas-panel" aria-label="记忆浏览">
    <nav class="view-tabs" aria-label="浏览方式"><button data-tab="graph" aria-pressed="true">记忆图</button><button data-tab="story" aria-pressed="false">章节与叙事</button></nav>

<script id="dataset" type="application/json">{"schema":"neurobook.memory.v7","book":{"id":"novel-villain-fox","title":"转生反派萝莉，找茬魔法少女"},"snapshot":{"id":"gold-first-two-chapters-v1","sourceManifest":"manifest:e0a4f751acd615a3","knowledgeRevision":1,"readAt":{"chapter":2,"paragraph":87}},"sources":[{"id":"source-c01","revision":1,"chapterId":"c01","chapterOrder":1,"title":"第1章 反派魔法少女","paragraphs":["第1章 反派魔法少女","严正声明：本书出场角色均已满18岁，不存在任何未成年人！","———————————","【姓名。】","“……苏天晴。”","昏暗的房间里传出清脆悦耳的女声，还有一道仿佛来自遥远彼方的低沉言语。","苏天晴坐在床头，呆滞地看着眼前这本飘浮在半空中的黑色古书，余光从床边的落地镜中扫过，瞥见一道陌生的娇小身影——","灿烂金色的长发垂落在肩膀后背，毛茸茸的耳朵耷拉在头顶，随着自己不经意的动作而弹动两下，与刘海底下那精致的五官与眼眸交映着。","脖颈肩膀那白皙的肌肤倒映窗帘缝隙间洒入的阳光，让人不由得多看几眼。","一只娇小的金毛狐女。","如果再加上背后那只正在炸毛的大尾巴，这应该是一只乖巧可爱的毛茸茸金毛狐狐。","【嗯嗯……这样啊……】","房间中的低沉言语再次响起，将苏天晴的注意力拽回眼前这本黑色古书。","苏天晴有些茫然。","五分钟前，结束了连续三个夜班后刚下班的自己坐在街边面摊上嗦着一碗加了煎蛋的豪华牛肉面，正往碗里加着辣椒面，突然听到自己太奶在背后说话，恍惚间回头一看，只见太奶坐在藤椅上悠闲地编着一只围巾，然后胸口一疼眼前一黑，就这么背过了气去。","看着在身侧摇曳的炸毛大尾巴，苏天晴鬼使神差地伸手，在尾巴上用力薅了一把。","无比柔顺的绝妙触感从手上传来，随后是一股陌生的摩挲拉拽感，从尾巴尖直冲天灵盖，惊得两只耳朵猛然竖起，整只狐都绷直了身体。","好真实的触感！","【……你干嘛呢。】","黑色古书发出低沉的言语，不太明白眼前这只狐狐为什么要突然用怪异的手法去薅她自己的尾巴。","不疼的吗？","“咳咳！等一下，稍等一下！”","苏天晴干咳两声掩饰尴尬，伸手阻止了面前这本奇怪的古书继续说话，眼珠一转，飞快地理清思绪。","我重生了。","重生成了一只金毛狐女。","那么眼前这本黑色会说话的书是怎么回事？有人能给我解释一下吗？","“你是谁？”苏天晴扭头正视眼前这本书，茫然地说道。","古书沉默了一会儿，像是在思考眼前这只呆头呆脑的狐狐到底是不是自己要找的人，良久后方才重复了一遍两分钟前的开场白：","【吾名墨丘利秘典，从星空彼岸远行至此，前来寻找我最优秀的适格者。】","【而那个人就是你，苏天晴小姐。】","再次听完这中二到能让人用脚趾扣出三室一厅的台词，苏天晴又陷入了沉默与思索。","然后，狐狐猛地从床上蹦下，走到落地镜前，沉默地看向镜子里那穿着宽松睡裙的娇小身影。","接着抬起一只脚，认真欣赏起这只白皙软嫩带着红晕的小脚。","嗯，完美，绝品。","【看来你对现在的身体很满意嘛。】","瞅见眼前这只狐狐认真欣赏脚丫的行径，古书一时语塞，憋了半天才冒出这么一句。","【但是你为什么要盯着脚看？正常情况下不应该是……】","“你不懂，小脚才是世界上最美好的瑰宝，吃饭的时候看见了都能多炫两碗。”","嘴上不搭调地回答着古书的话，苏天晴脑子里却也对现状有了个大概的了解。","这本书知道自己并不是这副身体原来的主人，难道说……","【既然你这么满意，那咱们可以直接快进到下个步骤了。】","古书说道，将一门心思投入到欣赏狐狐身躯的苏天晴从发癫中唤回，转身正视着它。","【听着，苏天晴。】","【你是墨丘利秘典的最佳适格者，作为星界使者，我会引导你走上完美的生活，而你只需要与我签订一个小小的契约——】","“好，我签。”","【……啊？】","古书凌乱了一下。","【不是，你不按套路出牌啊，契约怎么说签就签的？都不犹豫考虑一下吗？】","“这就是你思想狭隘了，小破书。”苏天晴的表情骤然严肃，让古书一时忘记了刚才那奇怪的称呼。","“我问你，世界上最通用的愿望是哪两个。”","【……哪两个？】古书愣愣地反问。","只见金毛狐狐俯下身子，伸出两根手指，在黑色古书面前轻轻晃动了两下，连带身后的毛茸茸大尾巴也跟着摇曳了起来。","“取之不尽的财富！以及变成萝莉！这是世界上最通用的两个愿望！”","苏天晴张开双臂，满眼放光。","“变成萝莉本身就是最大的奖励，更何况还是这样一只可爱的狐狐！”","沉默。","好像有哪里很对，好像又根本不对，但古书并未对这短时间的错乱而呆愣太久，迅速又将话题给拖回正题。","【既然你答应，那我们之间的契约就算成立了？】","“成立。”苏天晴不假思索。","但片刻后，狐狐突然反应过来了什么，好奇地问道：","“那个……我能问问契约的具体内容吗？”","总不能是激活了什么奇怪的奴隶契约吧！那样的话可就亏大发了！","【反派魔法少女。】","没有丝毫停顿，古书这般说道。","“啊？”","【既然契约已经签订，那么从今天开始，你就将成为魔法少女活跃于世，造物主给你量身定制了一整套任务，能帮助你逐步走上反派魔法少女的顶点！】","“不是、等一下！魔法少女是怎么回事！是那种死亡率高达90%的高危职业吗？！”","【放心吧，是王道系的那种。】","“就是这样才不对吧！在王道故事里当反派不是纯纯的找死吗！”","苏天晴突然有点后悔了。","王道系是什么？魔法少女们面对强敌逐渐成长然后喊着友情和羁绊冲上去把反派干碎的那种故事啊！就算反派有系统有任务也很难在王道系故事里把主角干碎吧！","我还能有反悔的机会吗？能不能把我送回原来的身体里啊我觉得急性心肌梗死还有抢救的机会——","【墨丘利秘典绑定成功。】","脑子里响起的声音让苏天晴欲哭无泪。","【契约成立。】","【走上反派魔法少女的道路吧，苏天晴。】"],"sha256":"1dd3945321370692b650a79c252a2adc2ba0d94cf2ecaeab525f6ad5b8872357"},{"id":"source-c02","revision":1,"chapterId":"c02","chapterOrder":2,"title":"第2章 反派的日常就是找茬","paragraphs":["第2章 反派的日常就是找茬","严正声明：本书出场角色均已满18岁！不存在任何未成年人！","——————————","“哗啦啦啦——”","“哗呸！”","吐掉嘴里的牙膏泡沫，苏天晴默默放下手中那只可爱的猫猫水杯与牙刷，双手撑住洗手池，抬起脑袋看向镜子里的金毛狐狐。","五官无可挑剔，精致可爱，毛发柔顺肌肤光滑，能从宽松睡衣的领口瞥见浅浅的河谷，那双不安中带着些许惊讶的眼眸更是摄人心魄，仿佛有着狐人生来便有的魅意。","抛开那听起来就很离谱的反派魔法少女不谈，这副身体的模样还真是绝妙中的绝妙。","每一个细节都满足了自己曾经的幻想，让人很想细细品尝一番——","“舔。”","舌尖传来的触感让人浑身一颤。","美妙。实际美妙。爷真是太可爱了。","无论是面庞还是身材，都与自己曾经想象中的完美匹配！","哪里还需要别的什么奖励？萝莉本身就是最美妙的奖励！","嘿嘿嘿，可爱的小狐狸，嘿嘿嘿。","哧溜！","与镜中的自己对视了半晌，苏天晴猛然察觉到自己这样的举动很像个变泰，脸颊微红，轻咳两声收敛发癫的状态，开始认真审视起自己身体中残留的记忆。","这副身体的原主人就叫苏天晴，这里与自己曾经的世界相差无几，但却是人类与兽人共存的一个世界。","这里的兽人指猫娘狐娘。不是那种从地里长出来的大菌子绿皮。","虽然名义上共存，但兽人数量远远不及人类，苏天晴从小便独自一人孤独地长大，虽然模样可爱但社恐孤僻，好在有兽人互助协会的资助顺利考上蓉城最好的医学院，却又在临近开学时染上一场兽人流感，熬夜过程中突发了暴发性心肌炎……","死法和自己一模一样呢。","“唔！”","想到这，苏天晴不由得感觉胸口幻痛，连忙伸手去揉了揉。",".","简单洗漱了一遍，苏天晴踩着不合脚的大拖鞋走到客厅，一边躺上沙发，一边顺手从茶几上拿起刚才那本跟自己说话的古书。","“……喂？小破书你在吗？”","沉默。","古书没有像刚才那样开口说话，仿佛床头那件事压根就没发生过似的。","该不会所谓的反派魔法少女根本就不存在吧？","揣着一丝侥幸，苏天晴举起手中这本古书，翻开扉页。","“啪嗒！”","“呜哇？！”","一枚金色十字星从书里掉出，狠狠砸在毫无防备的苏天晴脸上。","就好像正躺在床上刷手机结果手滑了的某人一样。","“好疼！……鼻血！鼻血冒出来了啊啊啊啊！”","金毛狐狐怪叫着伸手去抓纸巾，全然没注意到那枚金色十字星上沾染的鼻血，在一阵微弱的光芒后悄然融入十字星中消失不见。","一道陌生的声音在狐狐脑子里响起：","【守护之星激活】","【秘典序章已完成，开启每日任务】","每日任务？守护之星？好家伙你来真的。","正在往鼻孔塞纸巾后颈拍冷水的狐狐愣了一下，回头看向落在沙发上正在放出微光的金色十字星，发呆了好几秒才把它重新拿在手里。","材质不明的金色十字星，做工蛮精致，手感扎实，不像是塑料玩具，这个应该就是魔法少女们必备的变身道具了吧。","可这所谓的每日任务……要怎么查看呢？","像前世那些烂大街的网络小说一样心里默念一声“系统！”，还是说有什么特别的解锁密码？","而且……","把金色十字星拎在手里把玩了半晌，比起那个莫名其妙的秘典，苏天晴对这枚所谓的“守护之星”倒是更感兴趣，眼中甚至逐渐放出光彩。","魔法少女变身！穿着华丽的洋装在城市间穿梭飞行与怪人战斗！这具身体的原主人也曾经梦想过这种场面！","要试试看吗？","狐狐的尾巴不停地左右摇摆，试探性地将十字星捏在手里，轻声喊出那个有些羞耻的词：","“变……变身！”","没反应。","嗯？不对吗？变身不是这么喊的？还是说要加点什么前缀？","“魔法少女变身！”","“henshin！”","“光啊！”","“盖亚！！”","狐狐嗓子都快喊哑了，脑子里能想到的变身词全喊了一遍，却仍是没见手中这枚十字星有丁点动静。","不是，你这秘典都不给点新手指引的吗，别人拿到系统多少都有个新手任务好伐，至少教我怎么变身嘛！","破玩意！没意思！","狐狐气鼓鼓地瘫在沙发上，随手将十字星拿到面前端详了一会儿。","也没见这上面有写字呀，到底要怎么才能变身呢。","敲一下？搓动某个位置？还是说……","盯着十字星中间那枚刚好能容纳下一只手指的凹陷看了半晌，苏天晴试探着将拇指摁了进去。","光芒顷刻间笼罩了客厅。","只是一瞬，白光转眼间便消失不见，随后便是从身体各处传来的轻盈触感，以及脑海中那莫名响起的声音——","【初次变身，已完成】","“什、什么东西！？”苏天晴茫然地惊叫出声。","原来是触摸屏的吗！我还以为是声控呢！","站起身，转一圈，一边感受身体周围流淌的力量，苏天晴一边踱步走到卧室落地镜前，定睛看去。","有那么一瞬间，苏天晴有种想要抱着自己狂舔的冲动。","可爱。","除了可爱，依然是可爱。","过膝白袜，金色短款洋装，边缘点缀着缎带装饰，一枚闪亮的金色十字星缀在胸前领口，再加上身后那毛茸茸的大尾巴与头上两只耳朵，为这身本就华丽的衣裳添上一抹淡淡的灿烂光彩。","如果说自己对反派魔法少女这个强行安排的身份还有些残存的不满，那在看到变身后的模样时，苏天晴心中最后的抵触也荡然无存了。","不就是反派魔法少女吗！我这就当给你看！","镜中的狐狐眼神坚定，在胸前握紧拳头。","那么接下来，该看看所谓的每日任务是怎么回事了。","维持着变身后的状态，苏天晴踱步走回客厅，拿起沙发上那本已经不会说话的黑色古书，小心翼翼地翻开，生怕从里面再蹦出来什么东西砸自己脸上。","所幸这次没有，里面只是很普通的笔记书页，但第一页上却赫然浮现出几行文字：","【苏天晴】","【魔法少女（反派）】","【每日任务1：找茬魔法少女】","【正牌魔法少女在蓉城风生水起已经够久了，给她一点颜色瞧瞧】","【奖励：100神典石】","找茬正牌魔法少女？","看到这几个字，苏天晴微微一怔。","这看似简单的日常任务……好像还真不好做呢……"],"sha256":"ef54a0e67e97000b278f8684bfb504db99bf944aa19ae555d97d11a7dd315f17"}],"nodes":[{"id":"t-awake","revision":1,"label":"当前意识在卧室面对古书","availableAt":{"chapter":1,"paragraph":7},"scope":{"world":"original","perspective":"reader"},"spans":[{"sourceId":"source-c01","sourceRevision":1,"paragraph":7,"start":0,"end":55}],"dependencies":[],"readiness":"ready","kind":"time","data":{"description":"当前意识在卧室面对古书","precision":"relative","constraints":[]}},{"id":"t-past-collapse","revision":1,"label":"当前意识回忆的前世倒下","availableAt":{"chapter":1,"paragraph":15},"scope":{"world":"original","perspective":"reader"},"spans":[{"sourceId":"source-c01","sourceRevision":1,"paragraph":15,"start":0,"end":114}]
