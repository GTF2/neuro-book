<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单D · UI 选项图 v2</title>
<style>
:root {
  --ink: #1e2328;
  --muted: #68727d;
  --faint: #8d969f;
  --line: #cfd5da;
  --line-strong: #8d979f;
  --paper: #ffffff;
  --canvas: #eef1f3;
  --panel: #f5f7f8;
  --panel-2: #e7ebee;
  --accent: #2f5d7c;
  --accent-soft: #e3eef5;
  --warn: #8d5e16;
  --warn-soft: #fff3dc;
  --danger: #8b3535;
  --danger-soft: #f9e8e8;
  --success: #31694e;
  --success-soft: #e4f1e8;
  --shadow: 0 10px 24px rgba(35, 43, 49, .12);
  --radius: 8px;
}
* { box-sizing: border-box; }
html { background: var(--canvas); }
body { margin: 0; color: var(--ink); background: var(--canvas); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
button, input, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(47,93,124,.35); outline-offset: 2px; }
svg { display: block; }
.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.page { width: min(1800px, calc(100vw - 32px)); margin: 18px auto 48px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
.eyebrow { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 2px 0 4px; font-size: clamp(22px, 2vw, 30px); line-height: 1.2; letter-spacing: -.02em; }
.lede { max-width: 760px; margin: 0; color: var(--muted); }
.page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 7px 11px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--paper); font-size: 12px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { border-color: var(--ink); background: var(--ink); color: white; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.small { min-height: 28px; padding: 4px 8px; font-size: 11px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: 0 2px 5px rgba(30,35,40,.04); }
.toolbar .label { color: var(--muted); font-size: 12px; font-weight: 650; }
.segmented { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.segmented button { border: 0; border-radius: 5px; padding: 5px 10px; background: transparent; color: var(--muted); font-size: 12px; }
.segmented button.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 4px rgba(30,35,40,.12); font-weight: 700; }
.toolbar-spacer { flex: 1; }
.prototype-wrap { position: relative; margin-top: 14px; }
.prototype { --left-panel: 200px; --agent: minmax(430px, 1.52fr); --paper-col: minmax(260px, .92fr); display: grid; grid-template-columns: var(--left-panel) var(--agent) var(--paper-col); gap: 8px; min-height: 750px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 12px; background: #dfe4e7; box-shadow: var(--shadow); overflow: hidden; }
.prototype.layout-a { --left-panel: 215px; --agent: minmax(380px, 1.25fr); --paper-col: minmax(270px, .76fr); grid-template-columns: var(--left-panel) 190px var(--agent) var(--paper-col); }
.prototype.layout-c { --left-panel: 235px; --agent: minmax(470px, 1.35fr); --paper-col: minmax(250px, .72fr); }
.prototype.stage-review { --agent: minmax(270px, .62fr); --paper-col: minmax(650px, 2.25fr); }
.rail, .left-panel, .cockpit-column, .agent, .manuscript { min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); overflow: hidden; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 9px 6px; background: #e9edef; }
.rail-label { margin: 2px 0 3px; color: var(--faint); font-size: 9px; writing-mode: vertical-rl; letter-spacing: .12em; }
.rail-button { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--muted); }
.rail-button:hover, .rail-button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.rail-button .badge { position: absolute; right: -5px; top: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 10px; background: var(--danger); color: white; font-size: 9px; line-height: 16px; text-align: center; }
.panel-head, .agent-head, .paper-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 8px 11px; border-bottom: 1px solid var(--line); background: var(--panel); }
.panel-head strong, .agent-head strong, .paper-head strong { font-size: 12px; }
.panel-head small, .agent-head small, .paper-head small { color: var(--muted); font-size: 10px; }
.panel-body, .agent-body, .paper-body { min-height: 0; overflow: auto; }
.left-panel { display: flex; flex-direction: column; }
.left-panel[data-mode="dashboard"] .panel-body { padding: 10px; }
.nav-list { display: grid; gap: 5px; padding: 9px; border-bottom: 1px solid var(--line); }
.nav-link { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; text-align: left; color: var(--muted); font-size: 12px; }
.nav-link:hover, .nav-link.active { border-color: var(--line); background: var(--panel); color: var(--ink); }
.nav-link .count { margin-left: auto; color: var(--danger); font-size: 10px; font-weight: 700; }
.cockpit { margin-top: auto; padding: 9px; border-top: 1px solid var(--line); background: #f7f9fa; }
.cockpit h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 7px; font-size: 11px; }
.cockpit-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 4px 0; color: var(--muted); font-size: 11px; }
.cockpit-row strong { color: var(--ink); font-weight: 700; }
.cockpit-row.warn strong { color: var(--warn); }
.left-detail { padding: 10px; }
.detail-card { padding: 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.detail-card + .detail-card { margin-top: 8px; }
.detail-card h3 { margin: 0 0 5px; font-size: 12px; }
.detail-card p { margin: 0; color: var(--muted); font-size: 11px; }
.cockpit-column { display: flex; flex-direction: column; }
.cockpit-column .cockpit { margin-top: 0; border: 0; }
.cockpit-column .detail-card { margin: 10px; }
.cockpit-column .panel-body { padding: 0 10px 10px; }
.tag { position: relative; display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 4px; border: 1px solid var(--accent); border-radius: 50%; background: var(--accent); color: white; font-size: 10px; font-weight: 800; line-height: 1; vertical-align: middle; cursor: pointer; z-index: 5; }
.tag:hover::after, .tag:focus-visible::after { content: attr(data-tip); position: absolute; z-index: 50; top: calc(100% + 6px); left: 0; width: max-content; max-width: 240px; padding: 6px 8px; border-radius: 5px; background: var(--ink); color: white; font-size: 11px; font-weight: 500; line-height: 1.4; box-shadow: var(--shadow); }
body.hide-tags .tag { display: none; }
.mini-note { padding: 8px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); font-size: 11px; }
.agent { display: flex; flex-direction: column; background: #fbfcfc; }
.agent-head { background: var(--paper); }
.agent-head .head-left, .agent-head .head-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
.agent-body { display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 10px; }
.feed { display: flex; flex-direction: column; gap: 10px; }
.message-user { align-self: flex-end; max-width: 72%; padding: 8px 11px; border: 1px solid #c3d5e3; border-radius: 10px 10px 3px 10px; background: #e7f0f6; font-size: 12px; }
.work-block { padding: 0 0 9px; border-bottom: 1px solid var(--line); }
.work-head { display: flex; align-items: center; gap: 7px; width: 100%; padding: 3px 0; border: 0; background: transparent; color: var(--muted); text-align: left; font-size: 11px; }
.work-head:hover { color: var(--ink); }
.work-head .chev { width: 13px; height: 13px; }
.work-content { display: grid; gap: 6px; margin-top: 5px; }
.process-row { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: 11px; }
.process-row .process-arrow { color: var(--faint); }
.process-row .process-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.process-row .count { margin-left: auto; color: var(--faint); font-size: 10px; }
.process-row button { display: inline-flex; align-items: center; gap: 6px; min-width: 0; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; }
.process-detail { margin-left: 19px; padding: 7px 8px; border-left: 2px solid var(--line); background: var(--panel); color: var(--muted); font: 10px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
.ai-copy { color: var(--ink); font-size: 13px; line-height: 1.7; }
.ai-copy strong { font-weight: 750; }
.system-row { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); background: #f8fafb; font-size: 11px; }
.choice-card, .approval-card { padding: 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--paper); }
.choice-card h3, .approval-card h3 { margin: 0 0 5px; font-size: 12px; }
.choice-card p, .approval-card p { margin: 0; color: var(--muted); font-size: 11px; }
.choice-list { display: grid; gap: 5px; margin-top: 8px; }
.choice { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--paper); text-align: left; font-size: 11px; }
.choice:hover, .choice.selected { border-color: var(--accent); background: var(--accent-soft); }
.choice small { color: var(--muted); }
.impact { margin-top: 8px; padding: 7px 8px; border-radius: 5px; background: var(--warn-soft); color: var(--warn); font-size: 11px; }
.card-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.composer { position: relative; margin-top: auto; padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
.composer textarea { width: 100%; min-height: 46px; resize: vertical; border: 0; background: transparent; color: var(--ink); font-size: 12px; outline: 0; }
.composer-foot { display: flex; align-items: center; gap: 7px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.composer-foot .push { margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--muted); font-size: 10px; }
.composer-foot button { border: 0; background: transparent; color: inherit; }
.paper { display: flex; flex-direction: column; }
.paper-body { position: relative; padding: 14px; background: #fbfaf6; }
.paper-empty { display: grid; place-items: center; min-height: 100%; padding: 22px; text-align: center; color: var(--muted); }
.paper-empty .pulse { width: 10px; height: 10px; margin-bottom: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 7px var(--accent-soft); }
.paper-preview { max-width: 40ch; margin-top: 12px; padding: 10px 12px; border: 1px solid #d6d0c3; border-radius: 6px; background: white; color: var(--ink); font: 12px/1.8 Georgia, "Songti SC", serif; text-align: left; }
.paper-text { max-width: 42ch; margin: 0 auto; color: #34312d; font: 15px/1.9 Georgia, "Songti SC", serif; }
.paper-text p { margin: 0 0 12px; }
.selection-bar { position: absolute; z-index: 7; left: 22px; top: 78px; display: inline-flex; gap: 5px; padding: 5px 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--ink); color: white; box-shadow: var(--shadow); }
.selection-bar button { border: 0; background: transparent; color: white; font-size: 11px; }
.scale { position: absolute; top: 8px; right: 3px; bottom: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 18px; padding: 2px 0; }
.scale button { width: 12px; height: 2px; padding: 0; border: 0; background: var(--faint); }
.scale button.short { width: 7px; }
.scale button.active { width: 15px; height: 3px; background: var(--accent); }
.pending-pill { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 4px; padding: 4px 7px; border: 1px solid #d8b980; border-radius: 5px; background: var(--warn-soft); color: var(--warn); font-size: 11px; }
.overview-toast { padding: 7px 9px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); font-size: 11px; }
.dialog-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(20,25,29,.45); }
.dialog { width: min(640px, calc(100vw - 30px)); max-height: min(740px, calc(100vh - 40px)); overflow: auto; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--paper); box-shadow: var(--shadow); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 15px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 15px; }
.dialog-body { padding: 14px 15px 18px; }
.inspector { position: fixed; right: 20px; bottom: 20px; z-index: 90; width: min(320px, calc(100vw - 40px)); padding: 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--ink); color: white; box-shadow: var(--shadow); }
.inspector strong { display: block; margin-bottom: 3px; font-size: 12px; }
.inspector p { margin: 0; color: #d9e0e5; font-size: 11px; }
.feedback { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-top: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.feedback textarea { min-height: 42px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font-size: 11px; }
.feedback small { grid-column: 1 / -1; color: var(--muted); font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 9px; color: var(--muted); font-size: 11px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--paper); }
.layout-caption { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 10px 2px 6px; }
.layout-caption strong { font-size: 12px; }
.layout-caption span { color: var(--muted); font-size: 11px; }
.hidden { display: none !important; }
@media (max-width: 1200px) {
  .prototype, .prototype.layout-a, .prototype.layout-c { grid-template-columns: 46px 170px minmax(360px, 1.2fr) minmax(240px, .8fr); }
  .prototype.layout-a { grid-template-columns: 46px 170px 160px minmax(320px, 1fr) minmax(220px, .7fr); }
}
@media (max-width: 900px) {
  .page { width: min(100% - 16px, 760px); margin-top: 8px; }
  .page-head { display: block; }
  .page-actions { justify-content: flex-start; margin-top: 10px; }
  .prototype, .prototype.layout-a, .prototype.layout-c, .prototype.stage-review { display: flex; flex-direction: column; min-height: 0; overflow: visible; }
  .rail { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .rail-label { writing-mode: horizontal-tb; }
  .left-panel, .cockpit-column, .agent, .manuscript { min-height: 320px; }
  .prototype.layout-a .cockpit-column { order: 2; }
  .prototype.layout-a .agent { order: 3; }
  .prototype.layout-a .manuscript { order: 4; }
  .message-user { max-width: 82%; }
}
</style>
</head>

<div id="app"></div>
<script>
(() => {
  const KEY = "neurobook-single-d-option-v2";
  const icons = {
    grid: "i-grid", file: "i-file", chat: "i-chat", inbox: "i-inbox", users: "i-users", plot: "i-plot", globe: "i-globe", settings: "i-settings", bot: "i-bot", clock: "i-clock", chev: "i-chevron", down: "i-chevron-down", up: "i-chevron-up", x: "i-x", search: "i-search", edit: "i-edit", check: "i-check", alert: "i-alert", send: "i-send", panel: "i-panel", list: "i-list", eye: "i-eye"
  };
  const state = Object.assign({
    layout: "B",
    stage: "normal",
    scenario: "normal",
    tags: true,
    inspector: null,
    dialog: null,
    activeNav: "inbox",
    expandedBlock: true,
    expandedTools: {},
    selectedChoice: null,
    cockpitExpanded: false,
    feedback: {},
    picks: {}
  }, JSON.parse(localStorage.getItem(KEY) || "{}"));
  const app = document.getElementById("app");
  const h = (value) => String(value).replace(/[&<>\"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
  const icon = (name, cls = "icon") => `<svg class="${cls}" aria-hidden="true"><use href="#${icons[name] || name}"></use></svg>`;
  const tag = (id, name, desc) => state.tags ? `<button class="tag" data-action="inspect" data-id="${id}" data-name="${h(name)}" data-tip="${h(name)}：${h(desc)}" aria-label="${h(name)}">${id}</button>` : "";

    else if (act === "reject") { state.inspector = {name: "已拒绝", desc: "原型状态已变成“已拒绝”，真实项目里这里会进入重来或自己修改的二级路径。"}; }
    else if (act === "scale") { state.inspector = {name: `刻度 ${target.dataset.value}`, desc: "点击刻度直接定位，不弹中间全览层；右侧稿面只在审稿态接管。"}; }
    else if (act === "noop") { state.inspector = {name: "这是原型占位动作", desc: "这里用于确认位置和层级，真实接线在蓝图定稿后施工。"}; }
    persist(); render();
  });
  document.addEventListener("input", (event) => { if (event.target.id === "feedback") { state.feedback[state.layout] = event.target.value; persist(); } });
  render();
})();
</script>
</body>
</html>
