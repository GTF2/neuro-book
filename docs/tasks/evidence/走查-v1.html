<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroBook UI 走查 v1</title>
<style>
  :root { --ok:#16a34a; --warn:#d97706; --block:#dc2626; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; }
  * { box-sizing:border-box; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; margin:0; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:9; background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; }
  header h1 { margin:0 0 6px; font-size:20px; }
  .summary { display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .summary b { color:var(--ink); }
  .pill { padding:2px 10px; border-radius:99px; color:#fff; font-weight:600; }
  .pill.ok{background:var(--ok)} .pill.warn{background:var(--warn)} .pill.block{background:var(--block)}
  button.act { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; }
  button.act:hover { background:#f1f5f9; }
  main { max-width:1200px; margin:0 auto; padding:20px 24px 80px; }
  section.group { margin-top:36px; }
  section.group > h2 { font-size:17px; border-left:4px solid #3b82f6; padding-left:10px; }
  section.group > p.note { color:var(--muted); font-size:13px; margin:6px 0 14px; }
  .screen { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px; }
  .screen .head { display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .screen .head .name { font-weight:700; font-size:15px; }
  .screen .head .wid { color:var(--muted); font-size:12px; font-family:monospace; }
  .screen img { width:100%; border:1px solid var(--line); border-radius:8px; margin:10px 0; }
  .meta { font-size:13px; margin:6px 0; }
  .meta .k { color:var(--muted); margin-right:6px; }
  .file { font-family:monospace; font-size:12px; color:#2563eb; }
  .placeholder { border:2px dashed #cbd5e1; border-radius:8px; padding:28px; text-align:center; color:var(--muted); margin:10px 0; font-size:14px; background:#f8fafc; }
  .fb { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .fb input[type=text] { flex:1; min-width:240px; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; }
  .fb .mark { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
  .fb .mark[data-m="可以"].on { background:var(--ok); color:#fff; border-color:var(--ok); }
  .fb .mark[data-m="待改"].on { background:var(--warn); color:#fff; border-color:var(--warn); }
  .fb .mark[data-m="阻塞"].on { background:var(--block); color:#fff; border-color:var(--block); }
  .status-line { font-size:12px; color:var(--muted); margin-top:6px; }
  pre.export { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:8px; font-size:12px; overflow:auto; display:none; }
</style>
</head>
<body>
<header>
  <h1>NeuroBook UI 流程走查 · v1（editorial 主题 / master @ 走查当日）</h1>
  <div class="summary">
    <span>进度：<b id="s-done">0</b> / <b id="s-total">0</b> 屏已评</span>
    <span class="pill ok">可以 <b id="s-ok">0</b></span>
    <span class="pill warn">待改 <b id="s-warn">0</b></span>
    <span class="pill block">阻塞 <b id="s-block">0</b></span>
    <span style="flex:1"></span>
    <button class="act" onclick="exportMD()">导出 Markdown</button>
    <button class="act" onclick="exportJSON()">导出 JSON</button>
    <button class="act" onclick="resetAll()">清空本页反馈</button>
  </div>
  <div class="status-line">反馈自动保存于浏览器 localStorage；截图与本页同目录（相对路径引用）。</div>
</header>
<main id="app"></main>
<pre class="export" id="export-out"></pre>

  gf.setAttribute("data-walk-id", "v1-g" + group.g + "-group");

function save(id, patch) {
  const prev = JSON.parse(localStorage.getItem(LS(id)) || "{}");
  localStorage.setItem(LS(id), JSON.stringify(Object.assign(prev, patch)));
  refresh(id);
}
function load(id) { return JSON.parse(localStorage.getItem(LS(id)) || "{}"); }
function refresh(id) {
  const st = load(id);
  document.querySelectorAll(`[data-st="${id}"]`).forEach(el => {
    el.textContent = st.mark ? `已标：${st.mark}` + (st.text ? ` · ${st.text}` : "") : (st.text ? `有备注未评级` : "");
  });
  const input = document.querySelector(`input[data-fb="${id}"]`);
  if (input && input.value !== (st.text || "")) input.value = st.text || "";
  document.querySelectorAll(`.mark[data-id="${id}"]`).forEach(b => b.classList.toggle("on", b.dataset.m === st.mark));
  summary();
}
function summary() {
  let done = 0, ok = 0, warn = 0, block = 0;
  document.querySelectorAll("[data-walk-id]").forEach(el => {
    const st = load(el.getAttribute("data-walk-id"));
    if (st.mark || st.text) done++;
    if (st.mark === "可以") ok++;
    if (st.mark === "待改") warn++;
    if (st.mark === "阻塞") block++;
  });
  document.getElementById("s-done").textContent = done;
  document.getElementById("s-total").textContent = total;
  document.getElementById("s-ok").textContent = ok;
  document.getElementById("s-warn").textContent = warn;
  document.getElementById("s-block").textContent = block;
}
document.addEventListener("input", e => { if (e.target.dataset.fb) save(e.target.dataset.fb, { text: e.target.value }); });
document.addEventListener("click", e => {
  if (e.target.classList.contains("mark")) {
    const id = e.target.dataset.id, cur = load(id).mark;
    save(id, { mark: cur === e.target.dataset.m ? null : e.target.dataset.m, at: new Date().toISOString() });
  }
});
function collect() {
  const out = [];
  document.querySelectorAll("[data-walk-id]").forEach(el => {
    const id = el.getAttribute("data-walk-id");
    const name = (el.querySelector(".name") || {}).textContent || "";
    const fileEl = el.querySelector(".file");
    const st = load(id);
    out.push({ walkId: id, page: name, screenshot: fileEl ? fileEl.textContent : null,
      mark: st.mark || null, feedback: st.text || "", markedAt: st.at || null });
  });
  return out;
}
function download(name, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; a.click();
}
function exportJSON() {
  const rows = collect();
  const counts = { "可以": 0, "待改": 0, "阻塞": 0 };
  rows.forEach(r => { if (r.mark in counts) counts[r.mark]++; });
  download("走查-v1-反馈.json", JSON.stringify({
    version: "v1", exportedAt: new Date().toISOString(),
    progress: { total: rows.length, reviewed: rows.filter(r => r.mark || r.feedback).length, counts },
    screens: rows
  }, null, 2), "application/json");
}
function exportMD() {
  const rows = collect();
  const counts = { "可以": 0, "待改": 0, "阻塞": 0 };
  rows.forEach(r => { if (r.mark in counts) counts[r.mark]++; });
  const lines = [
    `# NeuroBook UI 走查反馈 v1`, ``,
    `- 导出时间：${new Date().toLocaleString()}`,
    `- 进度：已评 ${rows.filter(r => r.mark || r.feedback).length} / 共 ${rows.length} 屏`,
    `- 三档计数：可以 ${counts["可以"]} · 待改 ${counts["待改"]} · 阻塞 ${counts["阻塞"]}`, ``,
    `| walkId | 页面 | 截图 | 标记 | 反馈 |`, `|---|---|---|---|---|`
  ];
  rows.forEach(r => lines.push(`| ${r.walkId} | ${r.page} | ${r.screenshot || "—"} | ${r.mark || ""} | ${r.feedback || ""} |`));
  download("走查-v1-反馈.md", lines.join("\n"), "text/markdown");
}
function resetAll() {
  if (!confirm("清空本页全部反馈与标记？（不可恢复）")) return;
  document.querySelectorAll("[data-walk-id]").forEach(el => localStorage.removeItem(LS(el.getAttribute("data-walk-id"))));
  document.querySelectorAll("[data-walk-id]").forEach(el => refresh(el.getAttribute("data-walk-id")));
}
document.querySelectorAll("[data-walk-id]").forEach(el => refresh(el.getAttribute("data-walk-id")));
</script>
